[project]
name = "zenith-wallet-tracker"
version = "0.1.0"
description = "Zenith Wallet Tracker backend"
requires-python = ">=3.11"
dependencies = [
    "aiosqlite>=0.22.1",
    "email-validator>=2.3.0",
    "fastapi>=0.141.1",
    "fastapi-users-db-sqlalchemy>=7.0.0",
    "fastapi-users[sqlalchemy]>=15.0.5",
    "httpx>=0.28.1",
    "pydantic>=2.13.4",
    "python-dotenv>=1.2.3",
    "python-multipart>=0.0.32",
    "requests>=2.34.2",
    "sqlalchemy[asyncio]>=2.0.52",
    "starlette>=1.6.0",
    "uvicorn[standard]>=0.52.4",
    "yfinance>=1.6.0",
]

[tool.uv]
package = false
