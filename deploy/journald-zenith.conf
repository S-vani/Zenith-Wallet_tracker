# Keeps the systemd journal (backend errors, backup runs) for at most 14 days, as the privacy policy and Apple's
# privacy manifest promise. Install:
#   sudo mkdir -p /etc/systemd/journald.conf.d
#   sudo cp deploy/journald-zenith.conf /etc/systemd/journald.conf.d/zenith.conf
#   sudo systemctl restart systemd-journald
[Journal]
MaxRetentionSec=14day
SystemMaxUse=500M
