# nginx http-level settings for Zenith (docs/nginx-hardening.md sections 1 and 4). Ubuntu's nginx.conf includes
# /etc/nginx/conf.d/*.conf inside its http { } block, so deploy/setup-server.sh installs this as
# /etc/nginx/conf.d/zenith.conf instead of editing nginx.conf.

# Don't print the nginx version on error pages or in the Server header
server_tokens off;

# Up to 10 requests a minute per IP to the auth endpoints (bursts allowed in the API site), 10/s for the rest
limit_req_zone $binary_remote_addr zone=zenith_auth:10m rate=10r/m;
limit_req_zone $binary_remote_addr zone=zenith_api:10m rate=10r/s;
limit_req_status 429;

# Emailed links (/verify?token=, /reset-password?token=) carry live one-time tokens: keep them out of the log
map $request_uri $zenith_logged_uri {
    ~^(?<zenith_path>/(verify|reset-password))\?  $zenith_path?[removed];
    default                                        $request_uri;
}
log_format zenith '$remote_addr - [$time_local] "$request_method $zenith_logged_uri $server_protocol" '
                  '$status $body_bytes_sent "$http_user_agent" $request_time';
