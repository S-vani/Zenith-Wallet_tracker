# Cloud build for the iOS app (no Mac needed). Codemagic runs this on its macOS machines:
# web build -> copy into the Capacitor iOS project -> sign -> .ipa -> upload to TestFlight.
# Only Codemagic reads this file; it has no effect on the website or the server.
#
# One-time setup (all in a web browser):
#   Apple
#     1. Apple Developer account -> Certificates, IDs & Profiles -> Identifiers: register the App ID
#        ca.zenithwalletracker.app.
#     2. App Store Connect -> My Apps -> +: create the app with that bundle ID. Note its Apple ID number
#        (App Information -> Apple ID).
#     3. App Store Connect -> Users and Access -> Integrations -> App Store Connect API: create a key with the
#        App Manager role and download the .p8 (it can only be downloaded once).
#   Codemagic (codemagic.io, sign in with GitHub, add this repository)
#     4. Team settings -> Integrations -> Developer Portal: add the key from step 3 and name it "Zenith ASC key".
#     5. Team settings -> Code signing identities:
#        - iOS certificates: "Generate certificate" (Apple Distribution) using that key, and keep it in Codemagic.
#        - iOS provisioning profiles: "Fetch profiles" and pick the App Store profile for ca.zenithwalletracker.app
#          (create it in the Developer Portal first if none is listed).
#     6. App settings -> Environment variables: APP_STORE_APPLE_ID = the number from step 2.
#   Then start "iOS -> TestFlight" by hand, or push a tag like ios-v1.0.0.

workflows:
  ios-testflight:
    name: iOS -> TestFlight
    instance_type: mac_mini_m2
    max_build_duration: 60
    integrations:
      app_store_connect: Zenith ASC key
    environment:
      ios_signing:
        distribution_type: app_store
        bundle_identifier: ca.zenithwalletracker.app
      vars:
        # baked into the app at build time; the same public API the website uses
        VITE_BACKEND_URL: https://api.zenithwalletracker.ca
        XCODE_PROJECT: frontend/ios/App/App.xcodeproj
        XCODE_SCHEME: App
      node: 22
      # "latest" = the newest stable Xcode Codemagic offers, which Apple requires for new uploads anyway
      xcode: latest
    triggering:
      events:
        - tag
      tag_patterns:
        - pattern: "ios-v*"
    scripts:
      - name: Refuse a non-HTTPS API address
        script: |
          case "$VITE_BACKEND_URL" in
            https://*) echo "API: $VITE_BACKEND_URL" ;;
            *) echo "VITE_BACKEND_URL must start with https:// for the App Store build" && exit 1 ;;
          esac
      - name: Install frontend packages
        script: cd frontend && npm ci
      - name: Run the frontend tests
        script: cd frontend && npx vitest run
      - name: Build the app's web files and copy them into the iOS project
        # dist-ios is separate from the website's dist and leaves out website-only files (the demo video)
        script: cd frontend && npm run build:ios
      - name: Set up code signing
        script: xcode-project use-profiles --project "$XCODE_PROJECT"
      - name: Give this build a new build number
        script: |
          # without the app's Apple ID every build would be number 1 and App Store Connect rejects duplicates
          if [ -z "$APP_STORE_APPLE_ID" ]; then
            echo "Set APP_STORE_APPLE_ID in Codemagic (setup step 6 at the top of this file)" && exit 1
          fi
          # Starting from 0 is only right when App Store Connect answered and simply has no TestFlight build yet
          # (the very first upload): the tool then succeeds and prints no number ("Did not find latest build" goes
          # to the log). Any failure (bad key, network, wrong Apple ID) exits non-zero and stops the build here,
          # instead of quietly reusing build number 1, which App Store Connect would reject after signing.
          if ! LATEST=$(app-store-connect get-latest-testflight-build-number "$APP_STORE_APPLE_ID"); then
            echo "Couldn't read the latest TestFlight build number from App Store Connect (see the error above)"
            exit 1
          fi
          LATEST=$(printf '%s' "$LATEST" | tr -d '[:space:]')
          if [ -z "$LATEST" ]; then
            echo "No TestFlight build yet, this will be build 1"
            LATEST=0
          fi
          case "$LATEST" in
            *[!0-9]*) echo "Unexpected build number from App Store Connect: '$LATEST'" && exit 1 ;;
          esac
          cd frontend/ios/App && agvtool new-version -all $((LATEST + 1))
      - name: Build the signed .ipa
        script: xcode-project build-ipa --project "$XCODE_PROJECT" --scheme "$XCODE_SCHEME"
    artifacts:
      - build/ios/ipa/*.ipa
    publishing:
      app_store_connect:
        auth: integration
        submit_to_testflight: true
