<svg xmlns="http://www.w3.org/2000/svg" width="64" height="64" viewBox="0 0 64 64">
  <!-- Zenith mark: a "Z" whose diagonal is a rising chart line, on a navy-to-blue app tile -->
  <defs>
    <linearGradient id="zw-tile" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#1e40af"/>
      <stop offset="0.55" stop-color="#112a5c"/>
      <stop offset="1" stop-color="#0b1220"/>
    </linearGradient>
    <radialGradient id="zw-glow" cx="0.78" cy="0.18" r="0.62">
      <stop offset="0" stop-color="#60a5fa" stop-opacity="0.5"/>
      <stop offset="1" stop-color="#3b82f6" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="zw-ink" x1="0" y1="1" x2="1" y2="0">
      <stop offset="0" stop-color="#93c5fd"/>
      <stop offset="1" stop-color="#ffffff"/>
    </linearGradient>
    <filter id="zw-soft" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="2.2"/>
    </filter>
  </defs>
  <rect width="64" height="64" rx="15" fill="url(#zw-tile)"/>
  <rect width="64" height="64" rx="15" fill="url(#zw-glow)"/>
  <rect x="0.75" y="0.75" width="62.5" height="62.5" rx="14.25" fill="none" stroke="#bfdbfe" stroke-opacity="0.16" stroke-width="1.5"/>
  <g fill="none" stroke-linecap="round" stroke-linejoin="round">
    <path d="M17 17.5H40M24 46.5H47" stroke="#93c5fd" stroke-opacity="0.85" stroke-width="6"/>
    <path d="M17 46.5L31.5 30L36 35L47 17.5" stroke="#3b82f6" stroke-width="7" opacity="0.9" filter="url(#zw-soft)"/>
    <path d="M17 46.5L31.5 30L36 35L47 17.5" stroke="url(#zw-ink)" stroke-width="6"/>
  </g>
</svg>
